backend:
  name: github
  repo: ftaron2007-boop/Aether-Dreams-Site
  branch: main

publish_mode: editorial_workflow

# После загрузки картинок через админку они будут попадать сюда:
media_folder: "images/uploads"
public_folder: "images/uploads"

collections:
  - name: "artists"
    label: "Артисты"
    files:
      - name: "artists"
        label: "Список артистов"
        file: "data/artists.json"
        fields:
          - label: "Артисты"
            name: "artists"
            widget: "list"
            summary: "{{fields.name}} — {{fields.role}}"
            fields:
              - { label: "Slug (латиницей, для ссылки, без пробелов)", name: "slug", widget: "string" }
              - { label: "Имя / псевдоним", name: "name", widget: "string" }
              - { label: "Роль", name: "role", widget: "string" }
              - label: "Фото артиста (необязательно)"
                name: "photoImage"
                widget: "image"
                required: false
                hint: "Если не загрузишь фото — покажется абстрактная заглушка ниже."
              - label: "Заглушка (если фото не загружено)"
                name: "photo"
                widget: "select"
                options: ["artist-photo-1", "artist-photo-2", "artist-photo-3", "artist-photo-4"]
              - { label: "Био", name: "bio", widget: "text" }
              - label: "Дополнительные поля (роль/дата и т.п.)"
                name: "meta"
                widget: "list"
                fields:
                  - { label: "Название поля", name: "label", widget: "string" }
                  - { label: "Значение", name: "value", widget: "string" }

  - name: "journal"
    label: "Журнал"
    files:
      - name: "journal"
        label: "Записи журнала"
        file: "data/journal.json"
        fields:
          - label: "Записи"
            name: "entries"
            widget: "list"
            summary: "{{fields.date}} — {{fields.title}}"
            fields:
              - { label: "Дата (например: Сен 2026)", name: "date", widget: "string" }
              - { label: "Заголовок", name: "title", widget: "string" }
              - { label: "Текст записи", name: "excerpt", widget: "text" }

  - name: "releases"
    label: "Релизы"
    files:
      - name: "releases"
        label: "Список релизов"
        file: "data/releases.json"
        fields:
          - label: "Релизы"
            name: "releases"
            widget: "list"
            summary: "{{fields.title}} ({{fields.year}})"
            fields:
              - { label: "Название трека/релиза", name: "title", widget: "string" }
              - { label: "Тип", name: "type", widget: "select", options: ["Сингл", "EP", "Альбом"] }
              - { label: "Год", name: "year", widget: "string" }
              - label: "Обложка (необязательно)"
                name: "coverImage"
                widget: "image"
                required: false
                hint: "Если не загрузишь обложку — покажется абстрактная заглушка ниже."
              - label: "Заглушка (если обложка не загружена)"
                name: "cover"
                widget: "select"
                options: ["cover-1", "cover-2", "cover-3", "cover-4", "cover-5"]

  - name: "about"
    label: "О нас"
    files:
      - name: "about"
        label: "Текст страницы «О нас»"
        file: "data/about.json"
        fields:
          - { label: "Вступление (крупный текст сверху)", name: "lede", widget: "text" }
          - { label: "Блок «Кто мы»", name: "whoWeAre", widget: "text" }
          - { label: "Блок «Что мы делаем»", name: "whatWeMake", widget: "text" }
          - { label: "Ценности (список)", name: "values", widget: "list" }
          - { label: "Контакты", name: "contact", widget: "string" }
